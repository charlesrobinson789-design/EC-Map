<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CREST Assessment</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --ivory: #FAF6F0;
    --surface: #FFFFFF;
    --ink: #2B2230;
    --muted: #6E6472;
    --plum: #4A2C4F;
    --plum-2: #6B4572;
    --plum-soft: #F1EAF2;
    --sage: #7E9277;
    --sage-soft: #E9EEE5;
    --brass: #B08D57;
    --brass-soft: #F6EFE3;
    --line: #E8E0D6;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--ivory);
    color: var(--ink);
    font-family: Inter, system-ui, -apple-system, sans-serif;
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px 48px; }
  .wide { max-width: 760px; }

  .topbar { position: sticky; top: 0; z-index: 10; background: rgba(250,246,240,0.94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .topbar-inner { max-width: 760px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand { font-family: "Cormorant Garamond", serif; font-size: 20px; font-weight: 600; color: var(--plum); letter-spacing: 0.02em; }
  .tabs { display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
  .tab { border: 0; background: transparent; padding: 7px 14px; border-radius: 999px; font: inherit; font-size: 13px; font-weight: 500; color: var(--muted); cursor: pointer; }
  .tab.active { background: var(--plum); color: #fff; }
  .badge-count { display: inline-block; margin-left: 6px; min-width: 18px; padding: 0 5px; border-radius: 999px; background: var(--brass); color: #fff; font-size: 11px; line-height: 18px; text-align: center; }

  h1, h2, h3 { margin: 0; font-weight: 600; }
  .serif { font-family: "Cormorant Garamond", Georgia, serif; }
  .eyebrow { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--brass); font-weight: 600; }
  .muted { color: var(--muted); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; }
  .btn { display: block; width: 100%; min-height: 54px; border: 0; border-radius: 14px; background: var(--plum); color: #fff; font: inherit; font-weight: 600; font-size: 16px; cursor: pointer; transition: background .15s, transform .05s; }
  .btn:hover { background: var(--plum-2); }
  .btn:active { transform: scale(0.99); }
  .btn:disabled { background: #CFC6D0; cursor: not-allowed; }
  .btn-outline { background: var(--surface); color: var(--plum); border: 1.5px solid var(--plum); }
  .btn-outline:hover { background: var(--plum-soft); }
  .btn + .btn { margin-top: 10px; }
  .link { background: none; border: 0; color: var(--muted); font: inherit; font-size: 14px; cursor: pointer; padding: 8px 0; }
  .fine { font-size: 12.5px; color: var(--muted); }
  .fade { animation: fade .35s ease both; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .hero { padding: 36px 0 20px; }
  .hero h1 { font-family: "Cormorant Garamond", serif; font-size: 36px; line-height: 1.12; color: var(--plum); margin: 10px 0 14px; }
  .hero p { margin: 0 0 12px; }
  .meta-row { display: flex; gap: 16px; margin: 18px 0 24px; font-size: 14px; color: var(--muted); }
  .meta-row span::before { content: "•"; color: var(--brass); margin-right: 6px; }

  .progress-wrap { padding: 20px 0 8px; }
  .progress-meta { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .progress { height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; }
  .progress > div { height: 100%; background: linear-gradient(90deg, var(--plum), var(--brass)); transition: width .35s ease; }
  .q-text { font-family: "Cormorant Garamond", serif; font-size: 26px; line-height: 1.2; margin: 28px 0 20px; }
  .opt { display: block; width: 100%; text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 10px; min-height: 56px; font: inherit; font-size: 15.5px; color: var(--ink); cursor: pointer; transition: border-color .15s, background .15s; }
  .opt:hover { border-color: #CDBFD0; }
  .opt.selected { border-color: var(--plum); background: var(--plum-soft); }

  .result-head { padding: 30px 0 14px; }
  .result-head h1 { font-family: "Cormorant Garamond", serif; font-size: 36px; color: var(--plum); line-height: 1.1; margin: 8px 0 8px; }
  .section { margin-top: 16px; }
  .glance-row { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .glance-row:last-child { border-bottom: 0; padding-bottom: 0; }
  .glance-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; }
  .glance-said { font-size: 14px; color: var(--muted); margin-top: 6px; }
  .dots { display: flex; gap: 4px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
  .dot.on { background: var(--sage); }
  .glance-row.low .dot.on { background: var(--brass); }
  .start-tag { font-size: 11px; font-weight: 600; color: #7A5E30; background: var(--brass-soft); border: 1px solid #EADCC4; border-radius: 999px; padding: 2px 8px; margin-left: 6px; }
  .step { background: var(--brass-soft); border: 1px solid #EADCC4; border-radius: 14px; padding: 14px 16px; margin-top: 10px; }
  .actions { margin-top: 22px; }

  .field { margin-bottom: 18px; }
  .field label { display: block; font-weight: 500; font-size: 15px; margin-bottom: 7px; }
  input[type=text], input[type=email], textarea { width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; outline: none; }
  input:focus, textarea:focus { border-color: var(--plum); }
  textarea { min-height: 84px; resize: vertical; }
  .toast { margin-top: 12px; font-size: 14px; color: #3F5039; background: var(--sage-soft); border-radius: 10px; padding: 10px 12px; }

  .coach-head { padding: 26px 0 14px; }
  .coach-head h1 { font-family: "Cormorant Garamond", serif; font-size: 30px; color: var(--plum); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0 18px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; text-align: center; }
  .stat b { display: block; font-size: 22px; font-family: "Cormorant Garamond", serif; color: var(--plum); }
  .stat span { font-size: 11.5px; color: var(--muted); }
  .lead { margin-bottom: 12px; }
  .lead-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; cursor: pointer; }
  .lead-name { font-weight: 600; font-size: 16px; }
  .lead-sub { font-size: 13px; color: var(--muted); }
  .flag { font-size: 11.5px; font-weight: 600; padding: 4px 9px; border-radius: 999px; white-space: nowrap; }
  .flag.followup { background: var(--plum); color: #fff; }
  .flag.pdf { background: var(--brass-soft); color: #7A5E30; border: 1px solid #EADCC4; }
  .flag.quiz { background: #F0ECE8; color: var(--muted); }
  .example { font-size: 10.5px; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 1px 5px; margin-left: 6px; font-weight: 500; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { font-size: 12.5px; padding: 4px 9px; border-radius: 8px; background: var(--plum-soft); color: var(--plum); }
  .chip.plain { background: var(--ivory); border: 1px solid var(--line); color: var(--ink); }
  .detail { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 4px; }
  .qa { margin-top: 10px; font-size: 14px; }
  .qa .q { color: var(--muted); font-size: 12.5px; }
  .notes summary { cursor: pointer; font-weight: 600; color: var(--plum); }
  .notes ul { padding-left: 18px; margin: 10px 0 0; font-size: 14px; }
  .notes li { margin-bottom: 6px; }
  .empty { text-align: center; padding: 30px 16px; color: var(--muted); }

  @media (max-width: 420px) {
    .hero h1 { font-size: 31px; }
    .q-text { font-size: 23px; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

/* ---------------- Content ---------------- */
const QUESTIONS = [
  {
    pillar: "Clarity",
    text: "How clearly could you describe where your life is right now: your health, relationships, emotions, and spirit?",
    options: [
      "I haven't stopped to check in for a long time.",
      "I know something feels off, but I can't name it yet.",
      "I can describe most of it, with a few areas I tend to avoid.",
      "I can describe all of it clearly, including the hard parts."
    ],
    said: ["Haven't checked in for a while", "Something feels off, not yet named", "Clear on most areas", "Clear on all areas"]
  },
  {
    pillar: "Reclaiming Identity",
    text: "Finish this sentence: “Outside of my work and my role as my child's advocate, I am ___.” How did that go?",
    options: [
      "Nothing came to mind.",
      "I thought of who I used to be.",
      "I had an answer, but it changes with how the week is going.",
      "An answer came easily, and it feels steady."
    ],
    said: ["No answer came to mind", "Thought of who you used to be", "Answer shifts week to week", "Steady sense of self"]
  },
  {
    pillar: "Establishing Structures",
    text: "Your child's school calls at 10 a.m. You need to pick them up now, and you have an important meeting at 2. What happens next?",
    options: [
      "It's up to me, so something else has to give.",
      "I reach out to several people to find help.",
      "I have a few people to call, but I handle the details.",
      "I make one call. My backup knows the plan."
    ],
    said: ["No backup in place", "Help found case by case", "Backup available, you coordinate", "Backup set and ready"]
  },
  {
    pillar: "Stabilizing Energy",
    text: "How has your energy been over the past month?",
    options: [
      "Running low most days.",
      "I push through the week and crash when I stop.",
      "I have things that recharge me, but they slip when life gets busy.",
      "I keep up the things that recharge me, even in hard weeks."
    ],
    said: ["Running low most days", "Push through, then crash", "Recharge habits slip when busy", "Recharge habits holding"]
  },
  {
    pillar: "Thriving with Direction",
    text: "When you think about the next ten years, for your child and for yourself, what comes up?",
    options: [
      "Mostly worry.",
      "I research a lot, and it still feels unsettled.",
      "I've started planning for my child, but less for myself.",
      "I see a hopeful path for both of us, and I'm taking steps."
    ],
    said: ["Mostly worry", "Researching, still unsettled", "Planning for your child, less for you", "Hopeful path for both"]
  }
];

const PROFILES = {
  undertow: { name: "In the Undertow", line: "Several areas are asking for attention right now." },
  paddling: { name: "Paddling Hard", line: "Some areas are steady, and some could use support." },
  crest:    { name: "Ready to Ride the Crest", line: "Most areas are steady." }
};

const STEPS = {
  "Clarity": "Write down one thing about your life you haven't said out loud yet.",
  "Reclaiming Identity": "List three things that have been true about you in every season of your life.",
  "Establishing Structures": "Pick one task on your list that doesn't need to be you, and hand it off.",
  "Stabilizing Energy": "Choose one thing that restores you and put it on your calendar.",
  "Thriving with Direction": "Write one sentence about the life you hope for your child, and one for yourself."
};

/* ---------------- Grading ---------------- */
function grade(answers) {
  const total = answers.reduce((a, b) => a + b, 0);
  const profileKey = total <= 10 ? "undertow" : total <= 15 ? "paddling" : "crest";
  let lowIdx = 0;
  answers.forEach((v, i) => { if (v < answers[lowIdx]) lowIdx = i; });
  return { total, profileKey, lowIdx, lowPillar: QUESTIONS[lowIdx].pillar };
}

function status(lead) {
  if (lead.followup) return { key: "followup", label: "Session requested", next: "Reach out to schedule her follow-up session." };
  if (lead.pdf) return { key: "pdf", label: "PDF downloaded", next: "Optional check-in about her results." };
  return { key: "quiz", label: "Quiz only", next: "No action requested." };
}

/* ---------------- PDF ---------------- */
function downloadPdf(lead) {
  try {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: "pt", format: "letter" });
    const left = 56, width = 500;
    let y = 72;
    const plum = [74, 44, 79], ink = [43, 34, 48], muted = [110, 100, 114];

    doc.setFont("times", "bold"); doc.setFontSize(24); doc.setTextColor(...plum);
    doc.text("Your CREST Assessment Results", left, y); y += 22;
    doc.setFont("helvetica", "normal"); doc.setFontSize(10); doc.setTextColor(...muted);
    doc.text(new Date().toLocaleDateString(), left, y); y += 34;

    const p = PROFILES[lead.result.profileKey];
    doc.setFont("helvetica", "bold"); doc.setFontSize(14); doc.setTextColor(...plum);
    doc.text(p.name, left, y); y += 18;
    doc.setFont("helvetica", "normal"); doc.setFontSize(11); doc.setTextColor(...ink);
    doc.text(p.line, left, y); y += 32;

    doc.setFont("helvetica", "bold"); doc.setFontSize(12); doc.setTextColor(...plum);
    doc.text("Your answers at a glance", left, y); y += 20;
    QUESTIONS.forEach((q, i) => {
      doc.setFont("helvetica", "bold"); doc.setFontSize(11); doc.setTextColor(...ink);
      doc.text(q.pillar + (i === lead.result.lowIdx ? "  (starting point)" : ""), left, y);
      doc.setFont("helvetica", "normal"); doc.setTextColor(...muted);
      doc.text(q.said[lead.answers[i] - 1], left, y + 15);
      y += 36;
    });

    y += 8;
    doc.setFont("helvetica", "bold"); doc.setFontSize(12); doc.setTextColor(...plum);
    doc.text("One step for this week", left, y); y += 18;
    doc.setFont("helvetica", "normal"); doc.setFontSize(11); doc.setTextColor(...ink);
    doc.text(doc.splitTextToSize(STEPS[lead.result.lowPillar], width), left, y); y += 50;

    doc.setFontSize(9); doc.setTextColor(...muted);
    doc.text(doc.splitTextToSize("This is a coaching tool, not a medical or mental health screening. If you are struggling with persistent anxiety or depression, please reach out to a licensed mental health professional.", width), left, 730);

    doc.save("CREST-Assessment-Results.pdf");
    return true;
  } catch (e) {
    alert("The PDF could not be created in this browser.");
    return false;
  }
}

/* ---------------- Storage (this browser only) ---------------- */
const KEY = "crest-demo-leads-v2";
function loadLeads() { try { const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : null; } catch (e) { return null; } }
function saveLeads(l) { try { localStorage.setItem(KEY, JSON.stringify(l)); } catch (e) {} }

const EXAMPLES = [
  { id: "e1", example: true, name: "Danielle", contact: "danielle@example.com", when: "Today, 9:14 AM", answers: [2,1,1,2,1], pdf: true, followup: true, note: "Mornings are best for me." },
  { id: "e2", example: true, name: "", contact: "", when: "Yesterday, 8:40 PM", answers: [3,3,2,3,2], pdf: true, followup: false, note: "" },
  { id: "e3", example: true, name: "", contact: "", when: "Yesterday, 7:22 AM", answers: [4,3,4,3,4], pdf: false, followup: false, note: "" }
].map(l => ({ ...l, result: grade(l.answers) }));

/* ---------------- Client view ---------------- */
function Intro({ onStart }) {
  return (
    <div className="wrap fade">
      <div className="hero">
        <div className="eyebrow">The CREST Assessment</div>
        <h1>Where Is Your Foundation Cracking?</h1>
        <p>A short assessment for high-achieving moms raising a child with autism.</p>
        <p className="muted">There are no right or wrong answers. Choose what's true for you today.</p>
        <div className="meta-row"><span>5 questions</span><span>About 3 minutes</span></div>
        <button className="btn" onClick={onStart}>Begin</button>
        <p className="fine" style={{ marginTop: 16 }}>This is a coaching tool, not a medical or mental health screening. If you are struggling with persistent anxiety or depression, please reach out to a licensed mental health professional.</p>
      </div>
    </div>
  );
}

function Quiz({ answers, setAnswers, onDone, onBackToIntro }) {
  const [idx, setIdx] = useState(0);
  const [picked, setPicked] = useState(null);
  const q = QUESTIONS[idx];

  useEffect(() => { setPicked(answers[idx] ?? null); }, [idx]);

  function choose(points) {
    setPicked(points);
    const next = [...answers]; next[idx] = points; setAnswers(next);
    setTimeout(() => { if (idx < QUESTIONS.length - 1) setIdx(idx + 1); else onDone(next); }, 280);
  }

  return (
    <div className="wrap">
      <div className="progress-wrap">
        <div className="progress-meta"><span>Question {idx + 1} of {QUESTIONS.length}</span><span>{q.pillar}</span></div>
        <div className="progress"><div style={{ width: (idx / QUESTIONS.length) * 100 + "%" }} /></div>
      </div>
      <div className="fade" key={idx}>
        <div className="q-text">{q.text}</div>
        {q.options.map((opt, i) => (
          <button key={i} className={"opt" + (picked === i + 1 ? " selected" : "")} onClick={() => choose(i + 1)}>{opt}</button>
        ))}
      </div>
      <button className="link" onClick={() => idx === 0 ? onBackToIntro() : setIdx(idx - 1)}>← Back</button>
    </div>
  );
}

function Results({ lead, onPdf, onFollowup }) {
  const p = PROFILES[lead.result.profileKey];
  const [saved, setSaved] = useState(false);
  useEffect(() => { window.scrollTo(0, 0); }, []);
  return (
    <div className="wrap fade">
      <div className="result-head">
        <div className="eyebrow">Your results</div>
        <h1>{p.name}</h1>
        <p className="muted" style={{ margin: 0 }}>{p.line}</p>
      </div>

      <div className="card">
        <div className="eyebrow" style={{ marginBottom: 2 }}>Your answers at a glance</div>
        {QUESTIONS.map((q, i) => (
          <div key={q.pillar} className={"glance-row" + (i === lead.result.lowIdx ? " low" : "")}>
            <div className="glance-top">
              <span>{q.pillar}{i === lead.result.lowIdx && <span className="start-tag">Start here</span>}</span>
              <span className="dots">{[1,2,3,4].map(n => <span key={n} className={"dot" + (n <= lead.answers[i] ? " on" : "")} />)}</span>
            </div>
            <div className="glance-said">{q.said[lead.answers[i] - 1]}</div>
          </div>
        ))}
      </div>

      <div className="card section">
        <div className="eyebrow">One step for this week</div>
        <div className="step">{STEPS[lead.result.lowPillar]}</div>
      </div>

      <div className="actions">
        <button className="btn btn-outline" onClick={() => { if (onPdf()) setSaved(true); }}>Download my results (PDF)</button>
        <button className="btn" onClick={onFollowup}>Request a follow-up session</button>
        {saved && <div className="toast">Your PDF has been downloaded.</div>}
      </div>
    </div>
  );
}

function Followup({ onSubmit, onBack }) {
  const [f, setF] = useState({ name: "", contact: "", note: "" });
  const set = (k, v) => setF(prev => ({ ...prev, [k]: v }));
  const ready = f.name.trim() && f.contact.trim();
  useEffect(() => { window.scrollTo(0, 0); }, []);
  return (
    <div className="wrap fade">
      <div className="result-head">
        <div className="eyebrow">Follow-up session</div>
        <h1 style={{ fontSize: 32 }}>Request a session</h1>
      </div>
      <div className="field"><label>First name</label><input type="text" value={f.name} onChange={e => set("name", e.target.value)} /></div>
      <div className="field"><label>Email or phone</label><input type="text" value={f.contact} onChange={e => set("contact", e.target.value)} /></div>
      <div className="field"><label>Anything you'd like to share? (optional)</label><textarea value={f.note} onChange={e => set("note", e.target.value)} /></div>
      <button className="btn" disabled={!ready} onClick={() => onSubmit(f)}>Send request</button>
      <button className="link" onClick={onBack}>← Back to my results</button>
    </div>
  );
}

function Done({ name, onBack }) {
  useEffect(() => { window.scrollTo(0, 0); }, []);
  return (
    <div className="wrap fade">
      <div className="result-head">
        <div className="eyebrow">Request received</div>
        <h1>Thank you, {name}.</h1>
        <p className="muted">You'll hear back within two business days to set up your session.</p>
      </div>
      <button className="link" onClick={onBack}>← Back to my results</button>
    </div>
  );
}

/* ---------------- Coach view ---------------- */
function LeadCard({ lead, defaultOpen }) {
  const [open, setOpen] = useState(!!defaultOpen);
  const s = status(lead);
  const p = PROFILES[lead.result.profileKey];
  return (
    <div className="card lead">
      <div className="lead-top" onClick={() => setOpen(!open)}>
        <div>
          <div className="lead-name">{lead.name || "Anonymous"}{lead.example && <span className="example">example</span>}</div>
          <div className="lead-sub">{lead.when}</div>
        </div>
        <span className={"flag " + s.key}>{s.label}</span>
      </div>
      <div className="chips">
        <span className="chip plain">Score {lead.result.total}/20</span>
        <span className="chip">{p.name}</span>
        <span className="chip">Start: {lead.result.lowPillar}</span>
      </div>
      <div className="qa"><div className="q">Next step</div>{s.next}</div>
      {open && (
        <div className="detail">
          {QUESTIONS.map((q, i) => (
            <div key={q.pillar} className="qa"><div className="q">{q.pillar} ({lead.answers[i]}/4)</div>{q.said[lead.answers[i] - 1]}</div>
          ))}
          {lead.followup && <>
            <div className="qa"><div className="q">Contact</div>{lead.contact}</div>
            {lead.note && <div className="qa"><div className="q">Her note</div>{lead.note}</div>}
          </>}
        </div>
      )}
      <button className="link" onClick={() => setOpen(!open)}>{open ? "Hide answers" : "Show answers"}</button>
    </div>
  );
}

function CoachView({ leads, latestId, onReset }) {
  const order = { followup: 0, pdf: 1, quiz: 2 };
  const sorted = [...leads].sort((x, y) => order[status(x).key] - order[status(y).key]);
  const count = k => leads.filter(l => status(l).key === k).length;
  return (
    <div className="wrap wide fade">
      <div className="coach-head">
        <div className="eyebrow">Coach view</div>
        <h1>Assessment results</h1>
        <p className="muted" style={{ margin: "6px 0 0", fontSize: 14 }}>Each assessment is scored automatically.</p>
      </div>
      <div className="stats">
        <div className="stat"><b>{count("followup")}</b><span>Sessions requested</span></div>
        <div className="stat"><b>{count("pdf")}</b><span>PDF only</span></div>
        <div className="stat"><b>{count("quiz")}</b><span>Quiz only</span></div>
      </div>
      {sorted.length === 0
        ? <div className="card empty">No results yet.</div>
        : sorted.map(l => <LeadCard key={l.id} lead={l} defaultOpen={l.id === latestId} />)}

      <div className="card notes" style={{ marginTop: 18 }}>
        <details>
          <summary>Scoring</summary>
          <ul>
            <li>Each answer scores 1–4, for a total of 5–20.</li>
            <li>5–10: In the Undertow · 11–15: Paddling Hard · 16–20: Ready to Ride the Crest</li>
            <li>Starting pillar: the lowest-scoring answer. If two tie, the earlier pillar is used.</li>
          </ul>
        </details>
      </div>
      <button className="link" onClick={onReset}>Clear test results</button>
    </div>
  );
}

/* ---------------- App ---------------- */
function App() {
  const [view, setView] = useState("client");
  const [step, setStep] = useState("intro");
  const [answers, setAnswers] = useState([]);
  const [current, setCurrent] = useState(null);
  const [leads, setLeads] = useState(() => loadLeads() || EXAMPLES);

  useEffect(() => { saveLeads(leads); }, [leads]);

  const currentLead = leads.find(l => l.id === current);
  const update = (patch) => setLeads(prev => prev.map(l => l.id === current ? { ...l, ...patch } : l));

  function finishQuiz(final) {
    const id = "l" + Date.now();
    const when = new Date().toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" });
    setLeads(prev => [{ id, name: "", contact: "", note: "", when, answers: final, result: grade(final), pdf: false, followup: false }, ...prev]);
    setCurrent(id);
    setStep("results");
  }

  function handlePdf() {
    const ok = downloadPdf(currentLead);
    if (ok) update({ pdf: true });
    return ok;
  }

  function submitFollowup(f) {
    update({ name: f.name.trim(), contact: f.contact.trim(), note: f.note.trim(), followup: true });
    setStep("done");
  }

  function reset() { setLeads(EXAMPLES); setAnswers([]); setCurrent(null); setStep("intro"); setView("client"); }

  const newCount = leads.filter(l => !l.example).length;
  const start = () => { setAnswers([]); setStep("quiz"); };

  let screen;
  if (view === "coach") screen = <CoachView leads={leads} latestId={current} onReset={reset} />;
  else if (step === "quiz") screen = <Quiz answers={answers} setAnswers={setAnswers} onDone={finishQuiz} onBackToIntro={() => setStep("intro")} />;
  else if (step === "results" && currentLead) screen = <Results lead={currentLead} onPdf={handlePdf} onFollowup={() => setStep("followup")} />;
  else if (step === "followup" && currentLead) screen = <Followup onSubmit={submitFollowup} onBack={() => setStep("results")} />;
  else if (step === "done" && currentLead) screen = <Done name={currentLead.name} onBack={() => setStep("results")} />;
  else screen = <Intro onStart={start} />;

  return (
    <>
      <div className="topbar">
        <div className="topbar-inner">
          <div className="brand">CREST</div>
          <div className="tabs">
            <button className={"tab" + (view === "client" ? " active" : "")} onClick={() => setView("client")}>Client</button>
            <button className={"tab" + (view === "coach" ? " active" : "")} onClick={() => { setView("coach"); window.scrollTo(0, 0); }}>
              Coach{newCount > 0 && <span className="badge-count">{newCount}</span>}
            </button>
          </div>
        </div>
      </div>
      {screen}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
