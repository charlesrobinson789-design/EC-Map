        </footer>

        <script>
          (function () {
            var form = document.getElementById("intake-form");
            var status = document.getElementById("status");
            var button = document.getElementById("submit");
            form.addEventListener("submit", function (e) {
              e.preventDefault();
              status.className = "";
              if (!form.checkValidity()) {
                status.className = "err";
                status.textContent = "Please answer every question and confirm the note above the button.";
                var firstInvalid = form.querySelector(":invalid");
                if (firstInvalid) firstInvalid.focus();
                return;
              }
              var data = {};
              new FormData(form).forEach(function (v, k) { data[k] = String(v).trim(); });
              button.disabled = true;
              status.textContent = "Sending…";
              fetch("/api/intake", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) })
                .then(function (res) {
                  if (res.ok) {
                    form.querySelectorAll("input, select, textarea, button").forEach(function (el) { el.disabled = true; });
                    status.className = "ok";
                    status.textContent = "Thank you. Your intake is with Charles, and you'll hear back personally.";
                  } else {
                    status.className = "err";
                    status.textContent = res.status === 429 ? "Too many attempts. Please try again later." : "That didn't go through. Please check your answers and try again.";
                    button.disabled = false;
                  }
                })
                .catch(function () {
                  status.className = "err";
                  status.textContent = "Something went wrong. Please try again in a minute.";
                  button.disabled = false;
                });
            });
          })();
        </script>
      </body>
