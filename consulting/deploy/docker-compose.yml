# GENERATED by consulting/build.py. Edit the sources, then rebuild.
name: crm-consulting

services:
  edge:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-executivecapacitymap.com}
      ACME_EMAIL: ${ACME_EMAIL:-charles@executivecapacitymap.com}
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
      - source: site_index
        target: /srv/site/index.html
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ${ASSESS_WWW:-/opt/ecm/www}:/srv/assess:ro
    depends_on:
      - intake

  intake:
    image: python:3.13-alpine
    restart: unless-stopped
    command: ["python", "-u", "/app/intake.py"]
    environment:
      SMTP_HOST: ${SMTP_HOST:-smtp.hostinger.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-charles@executivecapacitymap.com}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      INTAKE_TO: ${INTAKE_TO:-charles@executivecapacitymap.com}
      SMTP_NO_TLS: ${SMTP_NO_TLS:-0}
    configs:
      - source: intake_py
        target: /app/intake.py

configs:
  caddyfile:
    content: |
      {
      	email {$$ACME_EMAIL}
      }

      {$$SITE_DOMAIN} {
      	encode zstd gzip
      	header {
      		Strict-Transport-Security "max-age=31536000"
      		X-Content-Type-Options nosniff
      		Referrer-Policy strict-origin-when-cross-origin
      		X-Frame-Options DENY
      	}
      	handle /api/intake {
      		reverse_proxy intake:8000
      	}
      	handle {
      		root * /srv/site
      		file_server
      	}
      }

      www.{$$SITE_DOMAIN} {
      	redir https://{$$SITE_DOMAIN}{uri} permanent
      }


  site_index:
    content: |
