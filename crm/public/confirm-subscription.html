<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Confirm subscription</title>
  <link rel="stylesheet" href="/public.css">
</head>
<body>
  <main class="card">
    <h1>Executive Capacity Map</h1>
    <p id="status" role="status">Confirming your subscription…</p>
  </main>
  <script>
    (async () => {
      const status = document.getElementById("status");
      const token = new URLSearchParams(location.search).get("token");
      if (!token) { status.textContent = "This confirmation link is incomplete. Please use the link from your email."; return; }
      try {
        const res = await fetch("/api/subscribe/confirm", {
          method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token })
        });
        status.textContent = res.ok
          ? "You're confirmed. Watch your inbox for the first email."
          : "This link has expired or was already used. You can sign up again from the website.";
      } catch {
        status.textContent = "Something went wrong. Please try the link again in a minute.";
      }
    })();
  </script>
</body>
</html>
