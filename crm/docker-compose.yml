# Self-hosted CRM stack (GoHighLevel-style), one isolated instance per business.
#   leadcms  - contacts, segments, email campaigns + sequences, content, admin UI   -> :8080
#   n8n      - workflow automations (form -> contact -> sequence, booking webhooks)  -> :5678
#   postgres - one server, separate database and owner per app
#   mailpit  - local email catcher (dev only; set real SMTP in .env for production)  -> :8025
# Everything binds to 127.0.0.1. Production adds Caddy via docker-compose.prod.yml.
#
# Run from this folder: ./setup.sh && docker compose up -d --build

name: ${INSTANCE_NAME:-crm}

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      TZ: UTC
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      LEADCMS_DB_PASSWORD: ${POSTGRES__PASSWORD}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

  leadcms:
    build:
      context: ./leadcms
      args:
        LEADCMS_VERSION: ${LEADCMS_VERSION:-1.5.155-pre}
    image: ${INSTANCE_NAME:-crm}-leadcms:${LEADCMS_VERSION:-1.5.155-pre}
    env_file:
      - .env
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:2.42.5
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
      GENERIC_TIMEZONE: ${TIMEZONE:-America/New_York}
      TZ: ${TIMEZONE:-America/New_York}
      N8N_LISTEN_ADDRESS: 0.0.0.0
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8ndata:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  n8ndata:
